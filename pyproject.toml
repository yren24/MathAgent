[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathagent"
version = "0.1.0"
description = "Agentic workflow for adaptive mathematical representation selection in molecular modeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "PyYAML>=6.0",
]

[project.scripts]
mathagent = "mint_scout.cli:main"
mint-agent = "mint_scout.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
agent = [
  "langgraph>=1.0,<2.0",
]
datasets = [
  "lmdb>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
