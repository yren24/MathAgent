task_id: onboarding-smoke
project_name: mint-agent
system_type: protein_ligand
task_type: regression
primary_metric: pcc
representation_mode: dataset_adaptive

dataset_manifest:
  path: ../data/onboarding_smoke_sapelo2.csv
  label_name: pK

pair_schema:
  schema_id: provisional_protein_ligand_40_v1
  protein_elements: [C, N, O, S]
  ligand_elements: [C, N, O, S, P, F, Cl, Br, I, H]

feature_generation:
  output_root: /path/to/workdir/mathagent/cache/plbind_features
  structure_staging_root: /path/to/workdir/mathagent/staging/structures

representation_design:
  adapter_supported_elements:
    protein: [C, N, O, S]
    ligand: [C, N, O, S, P, F, Cl, Br, I, H]
  support:
    min_element_support_fraction: 0.0
    min_element_support_samples: 1
    min_pair_support_fraction: 0.0
    min_pair_support_samples: 1
    max_element_pair_channels: 50
    small_molecule_self_pairs: false
  filtration:
    local_distance_quantile: 0.95
    dataset_distance_quantile: 0.95
    margin_factor: 1.10
    default_step_angstrom: 0.1
    allowed_steps_angstrom: [0.1, 0.2, 0.25, 0.5, 1.0]
    max_points: 200
    include_zero: true
    fixed_point_count: 50
  eic_tau_start: 0.2
  eic_tau_stop: 5.0
  eic_tau_step: 0.1
  saturation_audit_enabled: false
  distance_chunk_size: 2048

data_audit:
  tolerated_out_of_schema:
    protein: [H]

invariants: [PL, PH, CA, FPRC, EIC]
