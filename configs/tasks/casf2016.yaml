task_id: casf2016
project_name: mint-agent
system_type: protein_ligand
task_type: regression
primary_metric: pcc

pair_schema:
  schema_id: casf_protein_ligand_40_v1
  protein_elements: [C, N, O, S]
  ligand_elements: [C, N, O, S, P, F, Cl, Br, I, H]
  rule: role_aware_cartesian_product
  expected_pair_count: 40

invariants: [PH, PL, CA, FPRC, EIC]
gbt_config: plbind_feature_gbt_ensemble_v1
aggregation: mean

search:
  selection_unit: candidate_pipeline
  split_scope: train_only
  model_conditioned: true
  active_model_families: [gradient_boosting]
  candidates:
    - name: pl_legacy_gbt
      features: [PL]
      feature_schema: casf_protein_ligand_40_v1
      input_contract: fixed_vector
      normalize: legacy_standard_scaler
      training_protocol: train_set_cv_5fold
      model:
        name: legacy_gbt
        family: gradient_boosting
      fidelities: [0.10, 0.25, 0.50, 1.00]
      enabled: true
      notes: GBT baseline for PL under the legacy PLBind feature representation.
    - name: ph_legacy_gbt
      features: [PH]
      feature_schema: casf_protein_ligand_40_v1
      input_contract: fixed_vector
      normalize: legacy_standard_scaler
      training_protocol: train_set_cv_5fold
      model:
        name: legacy_gbt
        family: gradient_boosting
      fidelities: [0.10, 0.25, 0.50, 1.00]
      enabled: true
      notes: GBT baseline for PH under the legacy PLBind feature representation.
    - name: pl_ph_legacy_gbt
      features: [PL, PH]
      feature_schema: casf_protein_ligand_40_v1
      input_contract: fixed_vector
      normalize: legacy_standard_scaler
      training_protocol: train_set_cv_5fold
      model:
        name: legacy_gbt
        family: gradient_boosting
      fidelities: [0.10, 0.25, 0.50, 1.00]
      enabled: true
      notes: First complementarity candidate; evidence applies to PL+PH with GBT only.

cv:
  n_splits: 5
  split_seed: 2026

fidelity:
  fractions: [0.10, 0.25, 0.50, 1.00]
  stratify_target_quantiles: true
  stratify_atom_count_quantiles: true

bootstrap:
  n_bootstrap: 500
  ci: 0.95
  seed: 2026

stopping:
  target_pcc: 0.85
  minimum_reportable_pcc: 0.82
  patience: 3
  min_delta: 0.005
  max_subsets: 31

legacy:
  plbind_root: /path/to/legacy/embed_nn/plbind
  mintnn_root: /path/to/MINTNN
