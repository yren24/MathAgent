task_id: bdb2020plus-fullcv
project_name: mint-agent
system_type: protein_ligand
task_type: regression
primary_metric: pcc
representation_mode: dataset_adaptive

dataset_preparation:
  provider: bdb2020plus
  source_root: /path/to/workdir/mathagent/external/bdb2020plus/BDB2020+
  source_archive: /path/to/workdir/mathagent/external/bdb2020plus/BDB2020plus.tgz
  extract_root: /path/to/workdir/mathagent/external/bdb2020plus
  output_root: /path/to/workdir/mathagent/external/bdb2020plus_fullcv/prepared/structures
  output_manifest: /path/to/workdir/mathagent/external/bdb2020plus_fullcv/prepared/manifest.csv
  output_split: null
  pocket_cutoff_angstrom: 10.0
  add_hydrogens: true
  obabel: /path/to/MathAgent/scripts/sapelo2/obabel_2023a.sh

dataset_manifest:
  path: /path/to/workdir/mathagent/external/bdb2020plus_fullcv/prepared/manifest.csv
  label_name: pKa
  source: https://github.com/THGLab/LP-PDBBind/tree/master/dataset
  validate_paths: true
  columns:
    sample_id: sample_id
    target: target
    split: split
    roles:
      protein: protein_path
      ligand: ligand_path
    identifiers:
      pdb_id: pdb_id

pair_schema:
  schema_id: casf_protein_ligand_40_v1
  protein_elements: [C, N, O, S]
  ligand_elements: [C, N, O, S, P, F, Cl, Br, I, H]
  rule: role_aware_cartesian_product
  expected_pair_count: 40

invariants: [PH, PL, CA, FPRC, EIC]
gbt_config: plbind_feature_gbt_ensemble_v1
aggregation: mean

legacy:
  plbind_root: /path/to/legacy/embed_nn/plbind
  scratch_root: /path/to/scratch

feature_generation:
  output_root: /path/to/workdir/mathagent/external/bdb2020plus_fullcv/cache/plbind_features
  structure_staging_root: /path/to/workdir/mathagent/external/bdb2020plus_fullcv/staging/structures
  validate_output_shape: true

representation_design:
  adapter_supported_elements:
    protein: [C, N, O, S]
    ligand: [C, N, O, S, P, F, Cl, Br, I, H]
  support:
    min_element_support_fraction: 0.005
    min_element_support_samples: 10
    min_pair_support_fraction: 0.005
    min_pair_support_samples: 10
    max_element_pair_channels: 50
    small_molecule_self_pairs: false
  filtration:
    local_distance_quantile: 0.95
    dataset_distance_quantile: 0.95
    margin_factor: 1.10
    default_step_angstrom: 0.1
    allowed_steps_angstrom: [0.1, 0.2, 0.25, 0.5, 1.0]
    max_points: 200
    include_zero: true
    fixed_point_count: 50
  eic_tau_start: 0.2
  eic_tau_stop: 5.0
  eic_tau_step: 0.1
  saturation_audit_enabled: false
  distance_chunk_size: 2048

cv:
  n_splits: 5
  split_seed: 2026

data_audit:
  manifest_split: train
  tolerated_out_of_schema:
    protein: [H]
