task_id: atom3d-lba-identity60-official
project_name: mint-agent
system_type: protein_ligand
task_type: regression
primary_metric: pcc
representation_mode: dataset_adaptive

# Preserve the official 60%-sequence-identity train/validation/test protocol.
# Representation design and probe selection must use the train split only.
dataset_preparation:
  provider: atom3d_lba
  source_url: https://zenodo.org/api/records/4914718/files/LBA-split-by-sequence-identity-60.tar.gz/content
  source_archive_md5: 67cb0e830e76792b1aa1f361ed7611bb
  source_archive: /path/to/workdir/mathagent/external/atom3d_lba/LBA-split-by-sequence-identity-60.tar.gz
  extract_root: /path/to/workdir/mathagent/external/atom3d_lba/source
  source_root: /path/to/workdir/mathagent/external/atom3d_lba/source/split-by-sequence-identity-60/data
  source_splits: [train, val, test]
  output_root: /path/to/workdir/mathagent/external/atom3d_lba/prepared/identity60_official/structures
  output_manifest: /path/to/workdir/mathagent/external/atom3d_lba/prepared/identity60_official/manifest.csv
  output_split: null
  output_split_by_source:
    train: train
    val: validation
    test: test
  max_samples: null
  expected_sample_count: null
  python_executable: /path/to/MathAgent/.venv-langgraph/bin/python

dataset_manifest:
  path: /path/to/workdir/mathagent/external/atom3d_lba/prepared/identity60_official/manifest.csv
  label_name: neglog_aff
  source: https://doi.org/10.5281/zenodo.4914718
  validate_paths: true
  columns:
    sample_id: sample_id
    target: target
    split: split
    roles:
      protein: protein_path
      ligand: ligand_path
    identifiers:
      atom3d_id: atom3d_id
      source_split: source_split

pair_schema:
  schema_id: casf_protein_ligand_40_v1
  protein_elements: [C, N, O, S]
  ligand_elements: [C, N, O, S, P, F, Cl, Br, I, H]
  rule: role_aware_cartesian_product
  expected_pair_count: 40

invariants: [PH, PL, CA, FPRC, EIC]
gbt_config: plbind_feature_gbt_ensemble_v1
aggregation: mean

legacy:
  plbind_root: /path/to/legacy/embed_nn/plbind
  scratch_root: /path/to/scratch

feature_generation:
  output_root: /path/to/workdir/mathagent/external/atom3d_lba/cache/plbind_features
  structure_staging_root: /path/to/workdir/mathagent/external/atom3d_lba/staging/identity60_official
  validate_output_shape: true

representation_design:
  adapter_supported_elements:
    protein: [C, N, O, S]
    ligand: [C, N, O, S, P, F, Cl, Br, I, H]
  support:
    min_element_support_fraction: 0.005
    min_element_support_samples: 10
    min_pair_support_fraction: 0.005
    min_pair_support_samples: 10
    max_element_pair_channels: 50
    small_molecule_self_pairs: false
  filtration:
    local_distance_quantile: 0.95
    dataset_distance_quantile: 0.95
    margin_factor: 1.10
    default_step_angstrom: 0.1
    allowed_steps_angstrom: [0.1, 0.2, 0.25, 0.5, 1.0]
    max_points: 200
    include_zero: true
    fixed_point_count: 50
  eic_tau_start: 0.2
  eic_tau_stop: 5.0
  eic_tau_step: 0.1
  saturation_audit_enabled: false
  distance_chunk_size: 2048

cv:
  n_splits: 5
  split_seed: 2026

split_protocol:
  representation_design: train
  subset_selection: validation
  final_evaluation: test
  refit_after_selection: train_plus_validation
  test_query_count: 1

data_audit:
  manifest_split: train
  tolerated_out_of_schema:
    # The parity-validated legacy adapter currently exposes C/N/O/S protein
    # channels only. These atoms remain in the staged structures and audit.
    protein: [H, Ca, Cd, Co, Cs, Cu, Fe, K, Mg, Mn, Na, Ni, Sr, Zn]
