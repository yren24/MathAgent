task_id: atom3d-lba-test-fullcv
project_name: mint-agent
system_type: protein_ligand
task_type: regression
primary_metric: pcc
representation_mode: dataset_adaptive

# The official ATOM3D 30%-identity test split is used here as a standalone
# adaptation-validation dataset. The resulting CV is not the official ATOM3D
# train/validation/test benchmark protocol.
dataset_preparation:
  provider: atom3d_lba
  source_url: https://zenodo.org/api/records/4914718/files/LBA-split-by-sequence-identity-30.tar.gz/content
  source_archive_md5: 578ef179947bc5e3621bb24db89cbd55
  source_archive: /path/to/workdir/mathagent/external/atom3d_lba/LBA-split-by-sequence-identity-30.tar.gz
  extract_root: /path/to/workdir/mathagent/external/atom3d_lba/source
  source_root: /path/to/workdir/mathagent/external/atom3d_lba/source/split-by-sequence-identity-30/data
  source_splits: [test]
  output_root: /path/to/workdir/mathagent/external/atom3d_lba/prepared/structures
  output_manifest: /path/to/workdir/mathagent/external/atom3d_lba/prepared/manifest.csv
  output_split: null
  max_samples: null
  expected_sample_count: 490
  python_executable: /path/to/MathAgent/.venv-langgraph/bin/python

dataset_manifest:
  path: /path/to/workdir/mathagent/external/atom3d_lba/prepared/manifest.csv
  label_name: neglog_aff
  source: https://doi.org/10.5281/zenodo.4914718
  validate_paths: true
  columns:
    sample_id: sample_id
    target: target
    split: split
    roles:
      protein: protein_path
      ligand: ligand_path
    identifiers:
      atom3d_id: atom3d_id
      source_split: source_split

pair_schema:
  schema_id: casf_protein_ligand_40_v1
  protein_elements: [C, N, O, S]
  ligand_elements: [C, N, O, S, P, F, Cl, Br, I, H]
  rule: role_aware_cartesian_product
  expected_pair_count: 40

invariants: [PH, PL, CA, FPRC, EIC]
gbt_config: plbind_feature_gbt_ensemble_v1
aggregation: mean

legacy:
  plbind_root: /path/to/legacy/embed_nn/plbind
  scratch_root: /path/to/scratch

feature_generation:
  output_root: /path/to/workdir/mathagent/external/atom3d_lba/cache/plbind_features
  structure_staging_root: /path/to/workdir/mathagent/external/atom3d_lba/staging/structures
  validate_output_shape: true

representation_design:
  adapter_supported_elements:
    protein: [C, N, O, S]
    ligand: [C, N, O, S, P, F, Cl, Br, I, H]
  support:
    min_element_support_fraction: 0.005
    min_element_support_samples: 10
    min_pair_support_fraction: 0.005
    min_pair_support_samples: 10
    max_element_pair_channels: 50
    small_molecule_self_pairs: false
  filtration:
    local_distance_quantile: 0.95
    dataset_distance_quantile: 0.95
    margin_factor: 1.10
    default_step_angstrom: 0.1
    allowed_steps_angstrom: [0.1, 0.2, 0.25, 0.5, 1.0]
    max_points: 200
    include_zero: true
    fixed_point_count: 50
  eic_tau_start: 0.2
  eic_tau_stop: 5.0
  eic_tau_step: 0.1
  saturation_audit_enabled: false
  distance_chunk_size: 2048

cv:
  n_splits: 5
  split_seed: 2026

data_audit:
  manifest_split: train
  # Retain these atoms in the prepared structures, but exclude them from the
  # current parity-validated PL channels. Revisit when the adapter is expanded.
  tolerated_out_of_schema:
    protein: [H, Ca, Fe, Mg, Zn]
