version: mint-agent.user-request.v1
request_id: my-binding-dataset
goal: Predict protein-ligand binding affinity.
system_type: protein_ligand
task_type: regression
primary_metric: PCC
execution_profile: /path/to/MathAgent/configs/execution/template_hpc.yaml
# Optional. Omit this to use the project's versioned adaptive protein-ligand profile.
representation_profile: /path/to/MathAgent/configs/representation/protein_ligand_adaptive_v1.yaml

labels:
  # Provisional engineering guard; configure this for the study rather than
  # treating the default as a scientific constant.
  min_labeled_samples: 300
  allow_small_data_override: false

dataset:
  manifest_path: /path/to/samples.csv
  label_name: binding_affinity
  # Optional. Use a configured identifier when related samples must stay in one CV fold.
  cv_group_identifier: pdb_id
  validate_paths: true
  columns:
    sample_id: sample_id
    target: target
    split: split
    roles:
      protein: protein_path
      ligand: ligand_path
    identifiers:
      pdb_id: pdb_id

run:
  # Omit run_id to derive a stable ID from the validated request.
  # Restrict this list when the user explicitly wants particular methods.
  # Omit it to consider all five supported methods.
  invariants: [PH, PL, CA, FPRC, EIC]
  # Omit user_target to derive and record the stopping target from Scout.
  # satisfy_target: stop when a frozen-ranked subset reaches the target.
  # maximize_rank1: acquire all methods represented in Probe Rank 1.
  # maximize_all: acquire every requested method before selecting the best subset.
  selection_objective: satisfy_target
  auto_resume_failed: false
  max_attempts: 2
