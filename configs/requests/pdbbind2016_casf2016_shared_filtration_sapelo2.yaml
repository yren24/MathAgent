version: mint-agent.user-request.v1
request_id: pdbbind2016-casf2016-shared-filtration
goal: Run a protein-ligand binding-affinity benchmark on the PDBbind 2016 refined training split and protected CASF-2016 test split using the original shared filtration setting, where all distance-based mathematical methods use one unified filtration grid rather than method-specific filtration ranges or method-specific filtration repair.
system_type: protein_ligand
task_type: regression
primary_metric: PCC
execution_profile: /path/to/MathAgent/configs/execution/sapelo2_progressive_test.yaml
representation_profile: /path/to/MathAgent/configs/representation/protein_ligand_adaptive_shared_v1.yaml
hydrogen_policy:
  mode: exclude
  task_relevance: unlikely_relevant
  rationale: Explicit hydrogen atoms are excluded for the current protein-ligand binding-affinity benchmark.

labels:
  min_labeled_samples: 300
  allow_small_data_override: false

dataset:
  manifest_path: /path/to/workdir/mathagent/external/pdbbind2016_casf2016/manifest.csv
  label_name: pK
  source: pdbbind2016_refined_with_casf2016_split
  validate_paths: true
  cv_group_identifier: pdb_id
  columns:
    sample_id: sample_id
    target: target
    split: split
    roles:
      protein: protein_path
      ligand: ligand_path
    identifiers:
      pdb_id: pdb_id

run:
  run_id: pdbbind2016-casf2016-shared-filtration-20260921-v2
  invariants: [PH, PL, CA, FPRC, EIC]
  auto_resume_failed: false
  max_attempts: 2
  selection_objective: maximize_rank1

llm_scientific:
  mode: disabled

label_retrieval_allowed: false
