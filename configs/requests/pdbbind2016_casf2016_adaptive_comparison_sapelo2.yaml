version: mint-agent.user-request.v1
request_id: pdbbind2016-casf2016-user
goal: Compare bounded train-only adaptive representation settings before selecting mathematical methods on the protected CASF-2016 workflow.
system_type: protein_ligand
task_type: regression
primary_metric: PCC
execution_profile: /path/to/MathAgent/configs/execution/sapelo2_llm_dev.yaml
representation_profile: /path/to/MathAgent/configs/representation/protein_ligand_adaptive_v1.yaml

labels:
  min_labeled_samples: 300
  allow_small_data_override: false

dataset:
  manifest_path: /path/to/workdir/mathagent/external/pdbbind2016_casf2016/manifest.csv
  label_name: pK
  source: pdbbind2016_refined_with_casf2016_split
  validate_paths: true
  cv_group_identifier: pdb_id
  columns:
    sample_id: sample_id
    target: target
    split: split
    roles:
      protein: protein_path
      ligand: ligand_path
    identifiers:
      pdb_id: pdb_id

run:
  run_id: pdbbind2016-casf2016-adaptive-comparison-v2
  user_target: 0.75
  auto_resume_failed: false
  max_attempts: 2

llm_scientific:
  mode: advisory
  env_file: ~/.config/mathagent/openai.env
  cache_dir: /path/to/workdir/mathagent/cache/llm_scientific
  timeout_seconds: 180
  max_candidates: 10

label_retrieval_allowed: false
