version: mint-agent.user-request.v1
request_id: pdbbind2007-refined-best-available-topk-20260925
goal: Select a best-available protein-ligand representation from the frozen probe ranking, evaluate the top-k candidate pool without early stopping, and report the selected result on the protected PDBbind 2007 refined test split.
system_type: protein_ligand
task_type: regression
primary_metric: PCC
execution_profile: /path/to/MathAgent/configs/execution/sapelo2_progressive_test.yaml
representation_profile: /path/to/MathAgent/configs/representation/protein_ligand_adaptive_v1.yaml

labels:
  min_labeled_samples: 300
  allow_small_data_override: false

dataset:
  manifest_path: /path/to/workdir/mathagent/external/pdbbind2007_refined/manifest.csv
  label_name: pK
  source: pdbbind2007_refined_with_official_split
  validate_paths: true
  cv_group_identifier: pdb_id
  columns:
    sample_id: sample_id
    target: target
    split: split
    roles:
      protein: protein_path
      ligand: ligand_path
    identifiers:
      pdb_id: pdb_id

run:
  run_id: pdbbind2007-refined-best-available-topk-20260925
  selection_objective: maximize_top_k
  max_candidate_rank: 5
  test_evaluation_policy: test_acceptance
  invariants: [PH, PL, CA, FPRC, EIC]
  auto_resume_failed: false
  max_attempts: 2

llm_scientific:
  mode: advisory
  env_file: ~/.config/mathagent/openai.env
  cache_dir: /path/to/workdir/mathagent/cache/llm_scientific
  timeout_seconds: 180
  max_candidates: 10

label_retrieval_allowed: false
