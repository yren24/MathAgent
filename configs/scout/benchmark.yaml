probe:
  fraction: 0.20
  min_samples: 300
  max_samples: 1000
  target_quantile_bins: 10
  size_quantile_bins: 5
  min_pair_support: 3
  augmentation_fraction_limit: 0.10
  cv_folds: 5
  random_seed: 2026

bootstrap:
  enabled: true
  replicates: 25
  stratified: true
  ci_level: 0.95
  random_seed: 2026

metrics:
  primary: PCC
  secondary: [RMSE, MAE, R2]

model:
  family: fixed_gbt
  hpo: false
  params:
    config_id: engineering_cost_benchmark_not_scientific_evidence
    n_estimators: 100
    max_depth: 7
    min_samples_split: 5
    learning_rate: 0.01
    subsample: 0.5
    max_features: sqrt
    random_state: 42
    n_runs: 1
    normalize: StandardScaler

consensus:
  aggregation: arithmetic_mean
  weighted: false

target:
  user_target_takes_precedence: true
  auto_lower_quantile: 0.10
  auto_upper_quantile: 0.90
  absolute_relaxation:
    PCC: 0.02
    R2: 0.02
  relative_relaxation:
    RMSE: 0.05
    MAE: 0.05
  sanity_floor: null
